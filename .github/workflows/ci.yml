name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Trimmed for the v0.1.0-alpha stage: only the jobs that gate basic correctness on the two
# supported platforms run by default. The rest are paused (`if: false`), not deleted — see
# docs/CI_ROADMAP.md for what each one covers and when to turn it back on.
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev pkg-config
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked

  msrv:
    # Paused for the alpha stage; see docs/CI_ROADMAP.md.
    if: false
    # `rust-version` in Cargo.toml is a promise. Build with exactly that toolchain, ignoring
    # rust-toolchain.toml's "stable", so a newer language or library feature cannot slip in.
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.93.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev pkg-config
      - name: Install the minimum supported Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build on the minimum supported version
        run: cargo check --locked --all-targets

  deny:
    # Paused for the alpha stage; see docs/CI_ROADMAP.md.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories licenses sources

  bundle-macos:
    # Paused for the alpha stage; see docs/CI_ROADMAP.md.
    if: false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and verify the app bundle and disk image
        run: scripts/bundle-macos.sh dmg

  bundle-linux:
    # Paused for the alpha stage; see docs/CI_ROADMAP.md.
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev pkg-config desktop-file-utils imagemagick xvfb
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build and verify the AppImage
        run: scripts/bundle-linux.sh
      - name: Smoke test under Xvfb
        run: |
          appimage=$(ls target/linux/*.AppImage)
          timeout 20 xvfb-run -a "$appimage" --appimage-extract-and-run &
          pid=$!
          sleep 10
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid"
            status=$?
            printf 'AppImage exited early with status %s\n' "$status" >&2
            exit "$status"
          fi
          kill "$pid"
          wait "$pid" || true

  docs:
    # Paused for the alpha stage; see docs/CI_ROADMAP.md.
    if: false
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxinerama-dev libgl1-mesa-dev libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --no-deps --locked --document-private-items
